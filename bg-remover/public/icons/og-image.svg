<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>

  <!-- 装饰性网格 -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#c7d2fe" stroke-width="1"/>
    <line x1="200" y1="0" x2="1200" y2="360" stroke="#c7d2fe" stroke-width="1"/>
    <line x1="400" y1="0" x2="1200" y2="210" stroke="#c7d2fe" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="630" stroke="#c7d2fe" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="630" stroke="#c7d2fe" stroke-width="1"/>
    <line x1="0" y1="0" x2="600" y2="630" stroke="#c7d2fe" stroke-width="1"/>
  </g>

  <!-- 装饰性圆点 -->
  <circle cx="100" cy="530" r="60" fill="#818cf8" opacity="0.08"/>
  <circle cx="1100" cy="100" r="80" fill="#a78bfa" opacity="0.08"/>
  <circle cx="950" cy="500" r="40" fill="#6366f1" opacity="0.06"/>

  <!-- 左侧: 图片处理可视化 -->
  <g transform="translate(80, 165)">
    <!-- "原图" 卡片 -->
    <rect x="0" y="0" width="220" height="150" rx="16" fill="url(#card1)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="20" y="20" width="180" height="90" rx="8" fill="#4f46e5" opacity="0.3"/>
    <!-- 原图轮廓 (人形) -->
    <circle cx="110" cy="55" r="20" fill="#818cf8" opacity="0.5"/>
    <ellipse cx="110" cy="95" rx="35" ry="25" fill="#818cf8" opacity="0.4"/>
    <text x="110" y="135" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="13" font-family="sans-serif">原图</text>

    <!-- 箭头 -->
    <g transform="translate(240, 60)">
      <line x1="0" y1="15" x2="40" y2="15" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="40,8 50,15 40,22" fill="#a78bfa"/>
    </g>

    <!-- "处理后" 卡片 -->
    <rect x="290" y="0" width="220" height="150" rx="16" fill="url(#card1)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="310" y="20" width="180" height="90" rx="8" fill="#4f46e5" opacity="0.15"/>
    <!-- 抠图后效果 (只有人形) -->
    <circle cx="400" cy="55" r="20" fill="#c7d2fe" opacity="0.8"/>
    <ellipse cx="400" cy="95" rx="35" ry="25" fill="#c7d2fe" opacity="0.7"/>
    <!-- 透明背景格子 -->
    <g opacity="0.15">
      <rect x="310" y="20" width="15" height="15" fill="#818cf8"/>
      <rect x="340" y="20" width="15" height="15" fill="none" stroke="#818cf8" stroke-width="0.5"/>
      <rect x="355" y="20" width="15" height="15" fill="#818cf8"/>
      <rect x="310" y="35" width="15" height="15" fill="none" stroke="#818cf8" stroke-width="0.5"/>
      <rect x="340" y="35" width="15" height="15" fill="#818cf8"/>
      <rect x="355" y="35" width="15" height="15" fill="none" stroke="#818cf8" stroke-width="0.5"/>
    </g>
    <text x="400" y="135" text-anchor="middle" fill="#a78bfa" font-size="13" font-family="sans-serif" font-weight="bold">一键去背景 ✓</text>
  </g>

  <!-- 右侧: 标题 -->
  <g transform="translate(640, 0)">
    <!-- 徽章 -->
    <rect x="0" y="145" width="100" height="28" rx="14" fill="#818cf8" opacity="0.2"/>
    <circle cx="18" cy="159" r="4" fill="#34d399"/>
    <text x="30" y="163" fill="#a78bfa" font-size="13" font-family="sans-serif" font-weight="bold">浏览器本地</text>

    <!-- 主标题 -->
    <text x="0" y="215" fill="#ffffff" font-size="52" font-family="sans-serif" font-weight="800" letter-spacing="-1">
      AI 抠图
    </text>

    <!-- 副标题 -->
    <text x="0" y="260" fill="rgba(255,255,255,0.7)" font-size="22" font-family="sans-serif" font-weight="400">
      在线免费背景去除工具
    </text>

    <!-- 特性标签 -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <text x="68" y="22" text-anchor="middle" fill="#c7d2fe" font-size="14" font-family="sans-serif">🏎️ WebGPU 加速</text>
    </g>
    <g transform="translate(150, 300)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <text x="68" y="22" text-anchor="middle" fill="#c7d2fe" font-size="14" font-family="sans-serif">🔒 隐私保护</text>
    </g>
    <g transform="translate(0, 345)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <text x="68" y="22" text-anchor="middle" fill="#c7d2fe" font-size="14" font-family="sans-serif">📦 批量处理</text>
    </g>
    <g transform="translate(150, 345)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <text x="68" y="22" text-anchor="middle" fill="#c7d2fe" font-size="14" font-family="sans-serif">🆓 完全免费</text>
    </g>
  </g>

  <!-- 底部 -->
  <g transform="translate(0, 575)">
    <line x1="40" y1="0" x2="1160" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- 域名 -->
    <text x="40" y="30" fill="rgba(255,255,255,0.35)" font-size="14" font-family="sans-serif">ai-bg-remover.vercel.app</text>

    <!-- 统计 -->
    <text x="1160" y="30" text-anchor="end" fill="rgba(255,255,255,0.35)" font-size="13" font-family="sans-serif">支持 JPG / PNG / WebP</text>
  </g>
</svg>
