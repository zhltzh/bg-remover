<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>页面未找到 - AI抠图</title>
    <meta name="description" content="您访问的页面不存在或已被移动。返回 AI抠图 首页即可继续免费在线抠图。" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f9fafb;
        --surface: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --surface: #111827;
          --ink: #f9fafb;
          --muted: #9ca3af;
          --border: #1f2937;
          --accent: #6366f1;
          --accent-hover: #818cf8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 520px;
        width: 100%;
        text-align: center;
        padding: 48px 32px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(79, 70, 229, 0.08);
      }
      .code {
        font-size: clamp(72px, 18vw, 112px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--border);
        margin: 0;
        user-select: none;
      }
      h1 {
        font-size: clamp(20px, 4vw, 26px);
        margin: 20px 0 12px;
      }
      p {
        margin: 0 auto 32px;
        max-width: 380px;
        color: var(--muted);
        font-size: 15px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      a.primary {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
      }
      a.primary:hover { background: var(--accent-hover); }
      a.ghost {
        border: 1px solid var(--border);
        color: var(--ink);
      }
      a.ghost:hover { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">404</p>
      <h1>页面未找到</h1>
      <p>您访问的页面不存在或已被移动。返回首页继续免费在线抠图，图片处理全部在浏览器本地完成。</p>
      <div class="actions">
        <a class="button primary" href="/">返回首页</a>
        <a class="button ghost" href="/en/">English</a>
      </div>
    </main>
  </body>
</html>
